name: Build and deploy to GitHub Pages

# The live site is main. A test branch (PREVIEW_BRANCH) is built into /next/ on
# the same site, so it can be tried before it is merged:
#   https://birgerj.github.io/sort-sim/       main
#   https://birgerj.github.io/sort-sim/next/  the test branch
# The test branch's own "Preview" workflow (tests + build) triggers this one when
# it passes; this one always runs from main, so the Pages rules stay as they are.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Preview]
    types: [completed]

env:
  # Empty = no /next/.
  PREVIEW_BRANCH: night-shift-game

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build the test branch into /next/
        if: github.event_name != 'pull_request' && env.PREVIEW_BRANCH != ''
        run: |
          if ! git ls-remote --exit-code --heads origin "$PREVIEW_BRANCH" > /dev/null; then
            echo "No branch $PREVIEW_BRANCH: no /next/ this time."
            exit 0
          fi
          git clone --depth 1 --branch "$PREVIEW_BRANCH" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" next-src
          cd next-src
          npm ci
          npm run build
          mkdir -p ../dist/next
          cp -r dist/. ../dist/next/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
