<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0910" />
    <meta name="description" content="A parcel sorting hub in 3D that moves to its own ambient music. Day is clean production; night is a secret party." />
    <title>Sort sim</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sort sim" />
    <meta name="application-name" content="Sort sim" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Shown at once, before any script runs: building the hall takes a while on a phone. -->
    <div id="loading" style="position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b0910;color:#e8e6ef;font:15px/1.4 system-ui,-apple-system,sans-serif;transition:opacity .6s">
      <style>
        @keyframes ss-spin { to { transform: rotate(360deg); } }
        @keyframes ss-belt { to { background-position: 28px 0; } }
      </style>
      <div style="width:44px;height:44px;border-radius:50%;border:3px solid #2a2834;border-top-color:#2fa58f;animation:ss-spin 0.9s linear infinite"></div>
      <div style="font-size:20px;font-weight:600;letter-spacing:.02em">Sort sim</div>
      <div class="msg" style="opacity:.75">Building the hall…</div>
      <div style="width:180px;height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,#2a2834 0 10px,#3a3846 10px 14px);animation:ss-belt .6s linear infinite"></div>
    </div>
    <noscript>Sort sim needs JavaScript and WebGL.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
